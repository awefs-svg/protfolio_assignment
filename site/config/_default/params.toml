mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.png"

[footer]
    since = 2020

[sidebar]
    emoji    = "✏️"
    subtitle = "개발 프로젝트와 학승 경험을 정리한 포트폴리오"
    avatar   = "img/avatar.png"

[article]
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = []
    page     = [{ type = "toc" }]

[comments]
    enabled  = true
    provider = "disqus"

[cookies]
    enabled = false

    [cookies.categories]
        analytics  = true
        functional = true
